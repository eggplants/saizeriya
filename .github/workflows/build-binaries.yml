name: build-binaries

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout || 30 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux
          - { os: ubuntu-latest, target: linux-amd64 }
          - { os: ubuntu-24.04-arm, target: linux-arm64 }
          # macOS (macos-26-intel = Intel, macos-14 = Apple Silicon)
          - { os: macos-26-intel, target: macos-amd64 }
          - { os: macos-14, target: macos-arm64 }
          # Windows
          - { os: windows-latest, target: windows-amd64 }
          - { os: windows-11-arm, target: windows-arm64 }
          # Android
          - { os: ubuntu-latest, target: android-arm64, termux: true, timeout: 90 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        if: ${{ !matrix.termux }}
      - name: Build standalone binary
        if: ${{ !matrix.termux }}
        shell: bash
        env:
          UV_PYTHON_DOWNLOADS: automatic
        run: |
          uv sync --frozen --no-default-groups --extra tui
          uv run --with pyinstaller pyinstaller --clean --noconfirm --distpath dist packaging/saizeriya.spec
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        if: ${{ matrix.termux }}
        with:
          platforms: arm64
      - name: Build inside emulated Termux (aarch64)
        if: ${{ matrix.termux }}
        shell: bash
        run: |
          mkdir -p dist
          chmod 777 dist
          docker run --rm --platform linux/arm64 \
            --security-opt seccomp=unconfined \
            -v "${PWD}:/repo:ro" -v "${PWD}/dist:/out" -w /repo \
            -e PYINSTALLER_COMPILE_BOOTLOADER=1 \
            -e PYTHONDONTWRITEBYTECODE=1 \
            -e AIOHTTP_NO_EXTENSIONS=1 \
            -e FROZENLIST_NO_EXTENSIONS=1 \
            -e MULTIDICT_NO_EXTENSIONS=1 \
            -e PROPCACHE_NO_EXTENSIONS=1 \
            -e YARL_NO_EXTENSIONS=1 \
            termux/termux-docker:aarch64 bash -eux -c "
              apt update
              apt install -yq python clang binutils libxml2 libxslt pkg-config
              python --version
              command -v ldd >/dev/null || {
                printf '#!%s/bin/sh\nexit 0\n' \"\$PREFIX\" > \"\$PREFIX/bin/ldd\"
                chmod +x \"\$PREFIX/bin/ldd\"
              }
              pip install --no-cache-dir beautifulsoup4 httpx lxml textual pyinstaller
              pip install --no-cache-dir textual-serve || echo 'WARNING: textual-serve unavailable, tui --serve will not work'
              pyinstaller --clean --noconfirm --distpath /out --workpath \$PREFIX/tmp/build /repo/packaging/saizeriya.spec
              /out/saizeriya help
              status=0
              TEXTUAL_DRIVER=textual.drivers.headless_driver:HeadlessDriver \
                timeout 180 /out/saizeriya tui </dev/null >\$PREFIX/tmp/tui.log 2>&1 || status=\$?
              [ \"\$status\" = 124 ] || { echo \"saizeriya tui exited with \$status\"; tail -30 \$PREFIX/tmp/tui.log; exit 1; }
            "
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: saizeriya-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release-assets:
    name: attach binaries to release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
      - name: Stage release assets
        shell: bash
        run: |
          mkdir -p release
          for dir in artifacts/*/; do
            target="$(basename "$dir")"
            if [ -f "${dir}saizeriya.exe" ]; then
              cp "${dir}saizeriya.exe" "release/${target}.exe"
            elif [ -f "${dir}saizeriya" ]; then
              cp "${dir}saizeriya" "release/${target}"
            fi
          done
          ls -l release
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: release/*
          fail_on_unmatched_files: true
