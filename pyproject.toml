[build-system]
build-backend = "hatchling.build"
requires = [ "hatchling", "uv-dynamic-versioning" ]

[project]
name = "saizeriya"
description = "Unofficial Saizeriya Client"
readme = "README.md"
keywords = [
  "cli",
  "japanese",
  "menu",
  "restaurant",
  "saizeriya",
  "scraping",
  "textual",
  "tui",
]
license = "MIT"
authors = [ { name = "eggplants", email = "w10776e8w@yahoo.co.jp" } ]
requires-python = ">=3.14,<4"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Natural Language :: Japanese",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Utilities",
  "Typing :: Typed",
]
dynamic = [ "version" ]
dependencies = [
  "beautifulsoup4>=4.12",
  "httpx>=0.28.1",
  "lxml>=5",
]
optional-dependencies.tui = [
  "pillow>=11",
  "textual>=6",
  "textual-serve>=1.1.3",
  "zxing-cpp>=2.3",
]
urls.Documentation = "https://egpl.dev/saizeriya/"
urls.Issues = "https://github.com/eggplants/saizeriya/issues"
urls.Repository = "https://github.com/eggplants/saizeriya"
scripts.saizeriya = "saizeriya.cli:main"
scripts.saizeriya-mock-server = "saizeriya._mock:main"

[dependency-groups]
dev = [
  "pymarkdownlnt>=0.9.33",
  "pyproject-fmt>=2.11.1",
  "pytest>=9.0.2",
  "pytest-asyncio>=1.3",
  "pytest-cov>=7",
  "saizeriya[tui]",
]
docs = [
  "pdoc>=16",
]
mock = [
  "python-barcode>=0.16.1",
  "python-multipart>=0.0.27",
  "starlette>=1",
  "tdom>=0.1.15",
  "uvicorn>=0.46",
]

[tool.hatch]
version.source = "uv-dynamic-versioning"
build.targets.wheel.include = [ "saizeriya" ]
build.targets.sdist.include = [ "saizeriya" ]

[tool.uv]
python-downloads = "never"
default-groups = [
  "dev",
  "docs",
  "mock",
]
exclude-newer = "P7D"
preview = true

[tool.ruff]
line-length = 120
format.indent-style = "space"
format.quote-style = "double"
lint.select = [
  "ALL",
]
lint.ignore = [
  "COM812",
  "CPY001", # Missing copyright notice (this project does not use file headers)
  "D203",
  "D213",
]
lint.per-file-ignores."packaging/entrypoint.py" = [
  "INP001", # Implicit namespace package (frozen entry point, not importable content)
]
lint.per-file-ignores."saizeriya/shops.py" = [
  "RUF001", # Ambiguous unicode character (shop names carry full-width signs)
]
lint.per-file-ignores."saizeriya/tui/screens/*.py" = [
  "RUF001", # Ambiguous unicode character (Japanese UI copy uses full-width punctuation)
]
lint.per-file-ignores."scripts/*.py" = [
  "INP001", # Implicit namespace package (maintenance scripts, not importable content)
]
lint.per-file-ignores."tests/**" = [
  "ANN",     # Missing type annotations (tests/fixtures)
  "ARG",     # Unused arguments (pytest fixtures, lambda stubs)
  "D",       # Missing docstrings (tests)
  "INP001",  # Implicit namespace package (no __init__ in tests)
  "PLR0911", # Too many return statements (the fake transport routes by URL)
  "PLR2004", # Magic value used in comparison
  "RUF001",  # Ambiguous unicode character (the fixtures exercise full-width normalisation)
  "S101",    # Use of assert detected
  "S105",    # Possible hardcoded password (test fixtures)
]
lint.pydocstyle.convention = "google"

[tool.uv-dynamic-versioning]
vcs = "git"
style = "semver"
fallback-version = "0.0.0"
